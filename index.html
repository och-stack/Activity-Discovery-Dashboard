<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Home</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="/favi.png?v=1">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous">
    </script>
  </head>
  
  <body>
    <!--Login Authenticator Page-->
    <div id="auth-card">
      <img src="favi.png" alt="icon" height="30px">
      <h1>Choosy Picky</h1>
      <p>Nothing to do? Let's choose and pick something?</p>

      <label for="username">Username:</label>
      <input type="text" id="username" placeholder="Enter username.">

      <label for="password">Password:</label>
      <input type="text" id="password" placeholder="Enter password.">

      <label for="confirm-password">Confirm password:</label>
      <input type="text" id="confirm-password" placeholder="Re-enter password.">

      <button id="auth-button">Log In</button>

      <p id="auth-message"></p>

      <p>
        <span id="auth-question">Don't have an account?</span>
        <span id="toggle-link">Sign up</span>
      </p>
    </div>

    <!--Dashboard-->
    <div>
      <!--Navigation-->
      <nav>
        <!--Left nav-->
        <div>
          <img src="favi.png" alt="icon" height="30px">
          <strong>Choosy Picky</strong>
        </div>
        <!--Right nav-->
        <div>
          <span id="welcome-user"></span>
          <button id="logout-button">Log Out</button>
        </div>
      </nav>

      <!--Main Dashboard-->
      <main>
        <!--Greeting-->
        <div>
          <h2>Let's have fun!</h2>
          <p>Come to choose and pick something intresting.</p>
          <button id="get-activity-button">Roll it ~</button>
        </div>

        <!--Activity Details-->
        <div>
          <div id="activity-details"></div>
          <button id="save-button">Love it!</button>
        </div>

        <!--Activity Details-->
        <aside>
          <div>
            <h3>Saved Activities</h3>
            <p>Still bored?🤔 Pick me, pick me, pick me up!</p>
          </div>
        </aside>

      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
